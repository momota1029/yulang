name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # A run cancelled by a following push cannot be restarted from the API, so
  # without this a burst of pushes can leave the newest commit with no result
  # and no way to ask for one.
  workflow_dispatch:

permissions:
  contents: read

# Keep the linker configuration identical for every job that restores the
# shared target directory. Otherwise Cargo correctly invalidates its artifacts
# between the workspace build and the test jobs.
env:
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  workspace_build:
    name: workspace build
    runs-on: ubuntu-latest
    # A cold all-targets build can exceed the former 25-minute limit before a
    # cache matching its manifest key exists. Mold reduces link time; this
    # remains a safety margin for cold runners and unusually large changes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Check formatting
        run: cargo fmt --check

      # The test jobs below cover only seven crates. Everything else -- wasm
      # most of all, since the site deploy builds it -- must still be compiled
      # here before it can reach main.
      - name: Build every crate and target
        run: cargo build --workspace --all-targets

  runtime_tests:
    name: runtime tests
    needs: workspace_build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Test poly, specialize, and the runtimes
        run: cargo test -q -p poly -p specialize -p evidence-vm -p mono-runtime

  frontend_tests:
    name: frontend tests
    needs: workspace_build
    runs-on: ubuntu-latest
    # cprov_a_characterizes_constraints_replay_std_and_regressions alone
    # takes ~41 minutes (a known, pre-existing performance regression
    # attributed to commit 95b95586, unrelated to CI infrastructure) --
    # 45 minutes left almost no room for the rest of `-p parser -p infer`,
    # so the job was getting killed mid-run and reporting unrelated
    # in-flight tests as spurious failures rather than a genuine timeout.
    # This raise doesn't fix that regression; it stops the job from
    # producing misleading failures while it's outstanding.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Test parser and infer
        run: cargo test -q -p parser -p infer

  yulang_tests:
    name: yulang tests
    needs: workspace_build
    runs-on: ubuntu-latest
    # This job was observed taking ~55 minutes and getting killed at the
    # prior 45-minute limit; the exact slow test wasn't pinned down (the
    # GitHub Actions log for that run was unavailable), but this crate's
    # own test suite is known to include some std-compilation-heavy
    # fixtures. Raise the budget so a genuinely-slow-but-passing run isn't
    # reported as a spurious failure; this does not fix the underlying
    # slowness if there is a real regression here.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      # This test temporarily mutates a process-wide cache environment variable,
      # so keep it out of the parallel suite; the job below runs it alone.
      - name: Test yulang
        run: cargo test -q -p yulang -- --skip embedded_std_compiled_unit_artifact_persists_to_user_cache

  user_cache_isolation_test:
    name: user cache isolation test
    needs: workspace_build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Test user cache persistence in isolation
        run: cargo test -q -p yulang embedded_std_compiled_unit_artifact_persists_to_user_cache

  contract_shard_1:
    name: contract shard 1/4
    needs: workspace_build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Run contract shard 1 of 4
        run: cargo run -q -p yulang --bin yulang -- --std-root lib contract --shard 1/4 tests/yulang/cases.toml

  contract_shard_2:
    name: contract shard 2/4
    needs: workspace_build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Run contract shard 2 of 4
        run: cargo run -q -p yulang --bin yulang -- --std-root lib contract --shard 2/4 tests/yulang/cases.toml

  contract_shard_3:
    name: contract shard 3/4
    needs: workspace_build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Run contract shard 3 of 4
        run: cargo run -q -p yulang --bin yulang -- --std-root lib contract --shard 3/4 tests/yulang/cases.toml

  contract_shard_4:
    name: contract shard 4/4
    needs: workspace_build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install mold linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-mold-v1-
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Run contract shard 4 of 4
        run: cargo run -q -p yulang --bin yulang -- --std-root lib contract --shard 4/4 tests/yulang/cases.toml

  core_gate:
    name: core gate
    if: ${{ always() }}
    needs:
      - workspace_build
      - runtime_tests
      - frontend_tests
      - yulang_tests
      - user_cache_isolation_test
      - contract_shard_1
      - contract_shard_2
      - contract_shard_3
      - contract_shard_4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job to succeed
        env:
          WORKSPACE_BUILD: ${{ needs.workspace_build.result }}
          RUNTIME_TESTS: ${{ needs.runtime_tests.result }}
          FRONTEND_TESTS: ${{ needs.frontend_tests.result }}
          YULANG_TESTS: ${{ needs.yulang_tests.result }}
          USER_CACHE_ISOLATION_TEST: ${{ needs.user_cache_isolation_test.result }}
          CONTRACT_SHARD_1: ${{ needs.contract_shard_1.result }}
          CONTRACT_SHARD_2: ${{ needs.contract_shard_2.result }}
          CONTRACT_SHARD_3: ${{ needs.contract_shard_3.result }}
          CONTRACT_SHARD_4: ${{ needs.contract_shard_4.result }}
        shell: bash
        run: |
          test "$WORKSPACE_BUILD" = success
          test "$RUNTIME_TESTS" = success
          test "$FRONTEND_TESTS" = success
          test "$YULANG_TESTS" = success
          test "$USER_CACHE_ISOLATION_TEST" = success
          test "$CONTRACT_SHARD_1" = success
          test "$CONTRACT_SHARD_2" = success
          test "$CONTRACT_SHARD_3" = success
          test "$CONTRACT_SHARD_4" = success
