[case]
source = "main.yu"
description = "a late use after the first body item is deliberately outside both header projections, as bounded by the boundary note"
tags = ["late-use", "header-boundary"]

[input]
syntax_environment = "empty"

[boundary]
header_info = "raw_observation_only"
semantic_dependency = "not_asserted"
source_set_expansion = "not_asserted"
note = "The late use at byte 26 parses as an ordinary body statement outside HeaderInfo coverage and both header projections; no syntax-, semantic-, or source-set-dependency conclusion is asserted."

[header]
diagnostics = []

[header.coverage]
range = { start = 0, end = 13 }
stop = "first_non_header"

[[header.imports]]
key = "std-data"
range = { start = 0, end = 12 }
form = "plain"
path = ["std", "data"]
visibility = "private"

[full]
diagnostics = []

[[full.header_projection.imports]]
key = "std-data"
range = { start = 0, end = 12 }
form = "plain"
path = ["std", "data"]
visibility = "private"
