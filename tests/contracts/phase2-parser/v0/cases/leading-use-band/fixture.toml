[case]
source = "main.yu"
description = "a well-formed leading current-band import is discovered before the body"
tags = ["leading-use", "band-import", "header-discovery", "header-full-parity"]

[input]
syntax_environment = "empty"

[header]
diagnostics = []

[header.coverage]
range = { start = 0, end = 25 }
stop = "first_non_header"

[[header.imports]]
key = "band-support-value"
range = { start = 0, end = 24 }
form = "band"
path = ["support", "value"]
visibility = "private"

[full]
diagnostics = []

[[full.header_projection.imports]]
key = "band-support-value"
range = { start = 0, end = 24 }
form = "band"
path = ["support", "value"]
visibility = "private"
