model = "gpt-6-luna"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 12
# The proof/dispatcher roles inherit Sol/high; implementer explicitly pins
# Luna/high and the optional implementation escalation pins Astra/low.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.prover]
config_file = "agents/prover.toml"
description = "Resident constructive proof lane; submits implementation TODOs and returns exact proof evidence to the dispatcher."

# Retain explicit registrations for clients using this format. Newer clients
# also discover standalone role files; verify actual live role availability.

[agents.architect]
config_file = "agents/architect.toml"
description = "Read-only compiler architect for new decisions, cross-layer changes, uncertain behavior, and authoritative gate design."

[agents.compiler_referee]
config_file = "agents/compiler-referee.toml"
description = "Read-only adversarial referee for compiler semantics, root causes, IR invariants, soundness, recovery ownership, and edge cases."

[agents.docs_writer]
config_file = "agents/docs-writer.toml"
description = "Write-enabled public-documentation specialist for web/docs, README files, guides, release notes, and paired Japanese/English prose."

[agents.implementer]
config_file = "agents/implementer.toml"
description = "Luna/high implementation lane; advances approved compiler slices and submits exact proof TODOs."

[agents.implementation_escalation]
config_file = "agents/implementation-escalation.toml"
description = "One-off Astra/low implementation escalation after explicit Luna lease handoff; not resident."

[agents.performance_auditor]
config_file = "agents/performance-auditor.toml"
description = "Read-only performance and resource auditor for traversals, allocation, clones, caches, worklists, parallelism, and heavy verification."

[agents.regression_auditor]
config_file = "agents/regression-auditor.toml"
description = "Read-only regression auditor for sibling paths, public surfaces, fixtures, CST/AST parity, diagnostics, and unintended surface changes."

[agents.researcher]
config_file = "agents/researcher.toml"
description = "Complementary research producer for counterexamples, executable models and source-to-artifact evidence on explicitly leased paths."

[agents.spec_auditor]
config_file = "agents/spec-auditor.toml"
description = "Read-only exact-conformance auditor for Authoritative designs, language specifications, approved gates, and test contracts."

[agents.task_decomposer]
config_file = "agents/task-decomposer.toml"
description = "Read-only dependency-aware decomposition into concrete proof, falsification, source-correspondence and implementation packets without taking primary coordination."

[agents.next_action_selector]
config_file = "agents/next-action-selector.toml"
description = "Resident task dispatcher consulted by Luna at every action boundary; routes mutual TODOs and keeps safe implementation and proof lanes supplied."

[agents.theory_curator]
config_file = "agents/theory-curator.toml"
description = "Synchronize leased theory maps with adjudicated results and user corrections without inventing proofs, semantics or implementation authority."
