model = "gpt-6-luna"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 12
# The prover role inherits these defaults so an explicit, bounded Astra spawn
# can override them without changing the normal proof-worker model.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.prover]
config_file = "agents/prover.toml"
description = "Construct bounded constructive proofs and exact source-to-proof bridges for Yulang."
