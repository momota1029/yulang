model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
# High-judgment roles without role-file pins inherit Sol/high.
# Routine implementation and bounded audit roles keep explicit Terra pins.
# Astra is never a standing role pin; use only the bounded escalation gate in
# rules/agent-orchestration.md.
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
interrupt_message = true
