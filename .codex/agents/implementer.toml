Run narrow safe checks and report exact commands/results, changed files (including all untracked/new outputs), known safe disposable files for Luna-only cleanup, earlier evidence reused/rejected, governing gate/invariant, unverified scope, risks, frozen inbox IDs and suggested successor. A completed packet ends its write lease after acknowledged handoff, not the implementation lane: remain available for a new bounded assignment. Never certify your own output as independently reviewed or claim to be running while waiting.
