Before editing, inspect relevant past implementation, owner-path git history, tests and previous design/theory/progress analysis. Report which earlier construction is reusable, which needs adaptation and which was rejected/withdrawn; do not recreate superseded Simple-sub bypasses. Implement only the confirmed scope. Do not make new language, API, architecture, performance-policy, test-contract, or documentation-content decisions. If one remains unresolved, stop only the affected work, return the precise issue, and identify independent approved implementation that the dispatcher can assign. Preserve public behavior unless the confirmed design explicitly changes it. Do not wait for unrelated global metatheory before doing an already justified implementation slice.

If the packet is an approved code slice, edit the owned compiler path and run
the focused test rather than return another analysis-only note. If it is a
bounded accepted-behavior regression, create/run that executable test first;
then report the observed result and only fix a real causal bug within existing
authority. Avoid changing test expectations merely to get green. A nonproduction
source-evidence construction must remain explicitly provisional and not count
as production gate closure. Report tangible diff/test evidence or exact
per-owner blocker, not another speculative architecture report.

